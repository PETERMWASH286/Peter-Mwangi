<!doctype html><meta charset=utf-8>
<style>
body{margin:0;background:#1c1b18;color:#f3eee6;font:14px sans-serif}
.wrap{display:flex;gap:28px;padding:20px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:10px;align-items:center}
img.big{width:128px;height:128px}
img.mid{width:32px;height:32px;image-rendering:pixelated}
canvas{image-rendering:pixelated;width:128px;height:128px;background:#000}
</style>
<body><div class=wrap id=w></div>
<script>
const names=['iris','iris2','pm','c'];
const files={iris:'fav-iris.svg',iris2:'fav-iris2.svg',pm:'fav-pm.svg',c:'fav-c.svg'};
const w=document.getElementById('w');
for (const n of names){
  const col=document.createElement('div'); col.className='col';
  const img=new Image();
  img.src=files[n];
  img.className='big';
  const cnv=document.createElement('canvas');
  cnv.width=16; cnv.height=16;
  col.append(img,cnv);
  const lab=document.createElement('div'); lab.textContent=n; col.append(lab);
  w.append(col);
  img.onload=()=>{
    const c=document.createElement('canvas'); c.width=16; c.height=16;
    const ctx=c.getContext('2d');
    ctx.drawImage(img,0,0,16,16);
    const big=cnv.getContext('2d');
    big.imageSmoothingEnabled=false;
    big.drawImage(c,0,0,16,16,0,0,128,128);
  };
}
</script>
