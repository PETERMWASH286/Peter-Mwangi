<!doctype html>
<meta charset="utf-8">
<style>
  html,body { margin:0; background:#2a2824; }
  .row { display:flex; gap:18px; align-items:flex-end; padding:16px; }
  figure { margin:0; text-align:center; color:#f3eee6; font:12px ui-sans-serif; }
  img { display:block; background:#444; image-rendering:auto; }
  .s16 { width:16px; height:16px; }
  .s32 { width:32px; height:32px; }
  .s64 { width:64px; height:64px; }
  .pix { image-rendering:pixelated; }
</style>
<body>
<div class="row"><figure><img class="s16" src="fav-a.svg"><figcaption>a 16</figcaption></figure><figure><img class="s32 pix" src="fav-a.svg"><figcaption>a 32 px</figcaption></figure><figure><img class="s64" src="fav-a.svg"><figcaption>a 64</figcaption></figure></div><div class="row"><figure><img class="s16" src="fav-b.svg"><figcaption>b 16</figcaption></figure><figure><img class="s32 pix" src="fav-b.svg"><figcaption>b 32 px</figcaption></figure><figure><img class="s64" src="fav-b.svg"><figcaption>b 64</figcaption></figure></div><div class="row"><figure><img class="s16" src="fav-c.svg"><figcaption>c 16</figcaption></figure><figure><img class="s32 pix" src="fav-c.svg"><figcaption>c 32 px</figcaption></figure><figure><img class="s64" src="fav-c.svg"><figcaption>c 64</figcaption></figure></div><div class="row"><figure><img class="s16" src="fav-d.svg"><figcaption>d 16</figcaption></figure><figure><img class="s32 pix" src="fav-d.svg"><figcaption>d 32 px</figcaption></figure><figure><img class="s64" src="fav-d.svg"><figcaption>d 64</figcaption></figure></div></body>
